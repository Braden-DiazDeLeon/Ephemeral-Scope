[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-scope"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "packaging",
    "griffe",
    "certifi",
    # Required at runtime to load the saved classifier pipeline, not just to
    # train it. Pinned exactly: joblib stores the estimator's class layout, so
    # loading models/release_note_classifier.joblib under a different
    # scikit-learn emits InconsistentVersionWarning and may silently alter
    # predictions. Retrain and re-pin together.
    "scikit-learn==1.9.1",
    # 1.6.0, not 1.5.3: under NumPy 2.5 joblib 1.5.3 still sets `array.shape`
    # during unpickling, which raises DeprecationWarning and fails a
    # -W error load. 1.6.0 reads the same file cleanly.
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

# Rules and the verified classifier are loaded from the installed package,
# not from a source checkout, so both have to travel in the wheel. The
# checkout copy under models/ is what training writes; this one is what an
# install without that directory loads.
[tool.setuptools.package-data]
"ephemeral_scope.inference" = ["*.pl"]
"ephemeral_scope.ml" = ["*.joblib"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = ["-m", "not live"]
markers = [
    "integration: exercises SWI-Prolog or another local tool; skipped when absent",
    "live: contacts PyPI, GitHub, or OSV. Run with: pytest -m \"live and integration\"",
]
