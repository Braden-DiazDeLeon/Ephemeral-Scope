[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-scope"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "packaging",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
