[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-scope"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "packaging",
    "griffe",
    "certifi",
    # Required at runtime to load the saved classifier pipeline, not just
    # to train it.
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

embeddings = [
    "sentence-transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
